version: '3.8'

# ============================================================================
# N.E.K.O. Docker Compose 配置
# ============================================================================
#
# 支持两种镜像版本：
#   1. 标准版 (standard) - 轻量 (~1.5GB)，首次启动时下载 Chromium
#   2. 完整版 (full)     - 完整 (~2.5GB)，构建时已包含 Chromium，开箱即用
#
# 使用方法：
#   # 使用标准版（默认）
#   docker-compose up -d
#
#   # 使用完整版
#   NEKO_IMAGE_VERSION=latest-full docker-compose up -d
#
#   # 本地构建标准版
#   docker-compose build && docker-compose up -d
#
#   # 本地构建完整版
#   NEKO_IMAGE_VERSION=latest-full docker-compose -f docker-compose.yml build && \
#   NEKO_IMAGE_VERSION=latest-full docker-compose up -d
# ============================================================================

services:
  neko-main:
    # 容器镜像配置 - 支持通过环境变量切换版本
    # 标准版：latest (或 latest-standard) / 完整版：latest-full
    image: ${NEKO_IMAGE:-ghcr.io/project-n-e-k-o/n.e.k.o:${NEKO_IMAGE_VERSION:-latest}}

    # 备用镜像源（取消注释以使用）
    # image: ${NEKO_IMAGE:-docker.gh-proxy.org/ghcr.io/project-n-e-k-o/n.e.k.o:${NEKO_IMAGE_VERSION:-latest}}
    # image: ${NEKO_IMAGE:-projectneko/n.e.k.o:${NEKO_IMAGE_VERSION:-latest}}

    # 容器配置
    container_name: neko
    restart: unless-stopped

    # Cho phép container truy cập host machine (Ollama bridge)
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # 端口映射配置 (Chỉ lắng nghe trên localhost 127.0.0.1, không mở ra 0.0.0.0)
    ports:
      - "127.0.0.1:48911:80"
      - "127.0.0.1:48912:443"

    # 卷挂载配置
    volumes:
      # 1. neko 用户主目录（用户数据、SSL 证书与私钥）
      - ./neko-home:/home/neko

      # 2. 源码模式的调试日志回退目录
      - ./logs:/app/logs

      # 3. Source code overrides (localization & provider configuration)
      - ../static:/app/static
      - ../templates:/app/templates
      - ../utils/language_utils.py:/app/utils/language_utils.py
      - ../config/api_providers.json:/app/config/api_providers.json
      - ../config/api_profiles.py:/app/config/api_profiles.py
    # 环境变量
    environment:
      # 统一容器内的本地时间；可在 docker/.env 中改为其他 IANA 时区
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
      - NEKO_TRUSTED_HOSTS=neko.hoancauit.duckdns.org,*.hoancauit.duckdns.org,neko,localhost,127.0.0.1
      - SSL_DOMAIN=neko.hoancauit.duckdns.org

      # 强制所有运行时数据留在上述持久化挂载内，避免存储位置配置指向容器临时层
      - XDG_DATA_HOME=/home/neko/.local/share
      - NEKO_STORAGE_SELECTED_ROOT=/home/neko/.local/share/N.E.K.O
      - NEKO_STORAGE_ANCHOR_ROOT=/home/neko/.local/share/N.E.K.O


    # 网络配置
    networks:
      - neko-network
      - web_network

  # Bridge tự động kết nối Ollama (localhost:11434) vào Docker
  ollama-bridge:
    image: alpine/socat
    container_name: neko-ollama-bridge
    network_mode: host
    command: tcp-listen:11435,fork,bind=0.0.0.0 tcp-connect:127.0.0.1:11434
    restart: unless-stopped


# 网络定义
networks:
  neko-network:
    driver: bridge
  web_network:
    name: web_network
    external: true

